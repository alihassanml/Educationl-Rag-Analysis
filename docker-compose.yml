# docker compose up --build   ->   http://localhost:3000
# Copy .env.example to .env first and fill in SECRET_KEY, FILE_ENCRYPTION_KEY and GROQ_API_KEY.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+psycopg://edurag:${POSTGRES_PASSWORD:-edurag}@db:5432/edurag
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?set FILE_ENCRYPTION_KEY in .env}
  FILE_ENCRYPTION_KEY_ID: ${FILE_ENCRYPTION_KEY_ID:-v1}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  UPLOAD_DIR: /data/uploads

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edurag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurag}
      POSTGRES_DB: edurag
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edurag"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-env
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: ["arq", "app.workers.settings.WorkerSettings"]  # indexing jobs and the hourly reminder cron
    environment: *backend-env
    volumes: [uploads:/data/uploads]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck: {disable: true}

  frontend:
    build:
      context: ./frontend
      args: {BACKEND_URL: "http://backend:8000"}
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  pgdata:
  uploads:
